name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://user:password@127.0.0.1:3306/ruoyi_next_test
      JWT_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run audit:prod
      - run: npx next lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build
